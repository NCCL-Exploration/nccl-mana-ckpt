[project]
name = "nccl-mana-ckpt"
version = "0.1.0"
description = "Transparent GPU Checkpointing"
readme = "README.md"
requires-python = ">=3.9"

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | dmtcp
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "dmtcp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[dependency-groups]
dev = [
    "black",
    "ruff",
]
